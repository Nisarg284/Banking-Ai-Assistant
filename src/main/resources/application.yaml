spring:
  application:
    name: Banking Ai Assistant
  threads:
    virtual:
      enabled: true

groq:
  api-key: ${GROQ_API_KEY:}
  model-name: ${AI_MODEL_NAME:llama-3.3-70b-versatile}
  base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}

qdrant:
  api-key: ${QDRANT_API_KEY:}
  host-name: ${QDRANT_HOST_NAME:localhost}
  port: ${QDRANT_PORT:6334}
  collection-name: ${QDRANT_COLLECTION_NAME:banking-docs}

huggingface:
  api-key: ${HUGGINGFACE_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
